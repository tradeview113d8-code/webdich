<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>WebDich v0.4 — Voice → Text (channel toggles)</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
/* WebDich v0.4 — ultra-minimal, black, thin borders, mobile-first
 * Layout: LIVE 1/6 | FINAL 3.5/6 | CONTROLS 1.5/6 (channel toggles + mic)
 */
:root {
  --bg: #000000;
  --line: rgba(255, 255, 255, 0.12);
  --text: #f2f2f2;
  --muted: rgba(255, 255, 255, 0.42);
  --live: rgba(255, 255, 255, 0.6);
  --mic-off: #3a3a3a;
  --mic-on: #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.app {
  position: relative;
  height: 100dvh;
  height: 100vh; /* fallback */
  display: flex;
  flex-direction: column;
  max-width: 560px;
  margin: 0 auto;
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
}
/* persistent tiny version badge */
.version-badge {
  position: absolute;
  bottom: 6px;
  right: 10px;
  font-size: 9px;
  letter-spacing: 0.12em;
  color: rgba(255, 255, 255, 0.28);
  pointer-events: none;
  z-index: 5;
  font-weight: 500;
}
/* ---- LIVE VOICE — 1/6 ---- */
.live {
  flex: 0 0 16.6667%;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 20px;
  border-bottom: 1px solid var(--line);
  font-size: clamp(16px, 4.5vw, 22px);
  font-weight: 300;
  color: var(--live);
  text-align: center;
  overflow: hidden;
  line-height: 1.4;
  word-break: break-word;
}
.live.status {
  color: rgba(255, 130, 130, 0.85);
  font-size: 13px;
  letter-spacing: 0.02em;
}
/* ---- FINAL — 3.5/6, two columns (auto-scroll when long) ---- */
.final {
  flex: 0 0 58.3333%;
  min-height: 0;
  display: flex;
  border-bottom: 1px solid var(--line);
}
.col {
  flex: 1 1 50%;
  min-width: 0;
  padding: 14px 12px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.col + .col { border-left: 1px solid var(--line); }
.col.hidden { display: none; }
.col:only-child { flex: 1 1 100%; border-left: none; }
.col-label {
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
  font-weight: 500;
}
.col p {
  font-size: 15px;
  line-height: 1.6;
  font-weight: 400;
  word-break: break-word;
}
/* Phase 2: each row cell = final (source, gray) + trans (target, white, below) */
.row-cell { margin-bottom: 14px; }
.final-text { color: rgba(255, 255, 255, 0.5); margin-bottom: 4px; } /* source = gray */
.trans-text { color: #ffffff; margin-bottom: 0; }                   /* translation = white */
/* ---- CONTROLS — 1.5/6: EN toggle | MIC | VI toggle ---- */
.mic-row {
  flex: 0 0 25%;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 32px;
}
.channel-btn {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--mic-off); /* OFF = gray */
  color: #9a9a9a;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.05em;
  cursor: pointer;
  padding: 0;
  transition: background 0.2s ease, color 0.2s ease, transform 0.1s ease;
  -webkit-tap-highlight-color: transparent;
}
.channel-btn.on { background: #ffffff; color: #000000; } /* ON = white */
.channel-btn:active { transform: scale(0.92); }
#mic {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--mic-off); /* OFF = gray */
  cursor: pointer;
  padding: 0;
  position: relative;
  transition: background 0.2s ease, transform 0.1s ease;
  -webkit-tap-highlight-color: transparent;
}
#mic.on { background: var(--mic-on); } /* ON = white */
#mic:active { transform: scale(0.94); }
#mic svg {
  width: 26px;
  height: 26px;
  display: block;
  margin: 0 auto;
}
#mic .mic-stroke { stroke: #9a9a9a; transition: stroke 0.2s ease; }
#mic.on .mic-stroke { stroke: #000000; }
#mic.on::before {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.3);
  animation: wd-pulse 2.2s ease-out infinite;
  pointer-events: none;
}
@keyframes wd-pulse {
  0%   { transform: scale(0.92); opacity: 0.9; }
  100% { transform: scale(1.3);  opacity: 0; }
}
@media (max-width: 380px) {
  .mic-row { gap: 22px; }
  .channel-btn { width: 40px; height: 40px; font-size: 11px; }
  #mic { width: 56px; height: 56px; }
  #mic svg { width: 22px; height: 22px; }
  .col p { font-size: 14px; }
}

</style>
</head>
<body>
  <div class="app">
    <!-- 1/6 — LIVE VOICE -->
    <div id="live" class="live" aria-live="polite"></div>
    <!-- 3.5/6 — FINAL: EN left, VI right (channel-toggleable) -->
    <div class="final">
      <div id="final-en" class="col">
        <div class="col-label">Final English</div>
      </div>
      <div id="final-vi" class="col">
        <div class="col-label">Final Vietnamese</div>
      </div>
    </div>
    <!-- 1.5/6 — CHANNEL TOGGLES + MIC -->
    <div class="mic-row">
      <button id="ch-en" class="channel-btn on" aria-label="Toggle English channel" aria-pressed="true">EN</button>
      <button id="mic" aria-label="Toggle microphone" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect class="mic-stroke" x="9" y="3" width="6" height="11" rx="3"/>
          <path class="mic-stroke" d="M5 11a7 7 0 0 0 14 0"/>
          <line class="mic-stroke" x1="12" y1="18" x2="12" y2="22"/>
        </svg>
      </button>
      <button id="ch-vi" class="channel-btn on" aria-label="Toggle Vietnamese channel" aria-pressed="true">VI</button>
    </div>
    <div id="version-badge" class="version-badge"></div>
  </div>
  <script>
/* WebDich v0.3 — Voice → Text (dual-language ASR, row-synced chunks)
 * Fix language misclassification: run TWO SpeechRecognition instances simultaneously
 * (en-US + vi-VN) on the same audio, compare both transcriptions, commit the winner
 * to its correct language column. Single recognizer is unreliable when user language
 * != rec.lang (Vietnamese speech transcribed as English garble, and vice versa).
 * Row model + chunk timer (2s) + exact-prefix guard retained from v0.2.2.
 * Test hook exported under Node.
 */
(function () {
  'use strict';

  // ---------- DOM ----------
  var liveEl = document.getElementById('live');
  var enEl = document.getElementById('final-en');
  var viEl = document.getElementById('final-vi');
  var micBtn = document.getElementById('mic');
  var chEnBtn = document.getElementById('ch-en');
  var chViBtn = document.getElementById('ch-vi');

  // ---------- Config ----------
  var CHUNK_MS = 2000;      // one "voice" chunk = 2 seconds of speech
  var TAIL_WORDS = 15;      // exact committed tail kept for prefix guard
  var DUAL_WAIT_MS = 350;   // wait for other recognizer only if one final arrived (v0.3.1: was 700)
  var FAST_CONF = 0.8;      // confidence ≥ this → commit immediately (near-certain winner)
  var LOCK_MS = 600;        // after fast-path commit, discard loser's late final for this utterance
  var VERSION = 'v0.6.0';
  var BUILD = '20260911-0900';

  // ---------- State ----------
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var supported = !!SR;
  var micOn = false;
  var recEN = null, recVI = null;
  var viFailed = false;     // if vi recognizer denied, don't retry it
  var userStopped = false;
  var restartTimer = null, commitTimer = null, chunkTimer = null;
  var needRestart = { en: false, vi: false }; // coordinate dual restarts into one mic toggle
  var lastStartTs = 0;                        // cooldown against tight start/stop loops
  var committedTail = '';   // EXACT last committed words (built by us, not guessed)
  var rows = [];            // [{en, vi, finalized}] — synchronized row model
  var activeRow = null;
  var lockUntil = 0;        // timestamp until which late loser-finals are discarded
  var channel = { en: true, vi: true }; // which ASR channels / columns are active (Phase-2 foundation)
  // pending finals from each recognizer for the current utterance window
  var pending = { en: null, vi: null };

  // ---------- Word lists ----------
  var VI_DIACRITIC_RE = /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/;
  var NON_ASCII_RE = /[^\x00-\x7F]/;
  var VI_STOP = ['tôi','bạn','xin','chào','là','có','không','đi','đến','một','người','đây','đó',
    'gì','nào','mình','anh','chị','em','được','rồi','đang','sẽ','vì','nhưng','mà','và','với','từ',
    'trong','trên','dưới','giữa','sau','trước','ngay','rất','nhiều','ít','kia','này','hay','hoặc',
    'nếu','khi','đã','cũng','đều','lại','vẫn','chỉ','thì','ga','tàu','xe','nhà','biển','phố','ăn',
    'uống','nước','muốn','cảm','ơn','lỗi','cho','hỏi','ở','đâu','ra','vào','lên','xuống','qua','tiếp',
    'theo','nơi','đường','phải','trái','thẳng','đầu','cuối','giờ','phút','ngày','tuần','tháng','năm',
    'sáng','trưa','chiều','tối','nay','mai','quá','lại','nữa','về','xem','biết','nghe','nói','hỏi',
    'đợi','gặp','làm','lấy','đưa','trả','mua','bán','giá','bao','nhiêu','đồng','tiền','thẻ','vé',
    'máy','bay','sân','khách','sạn','nhà','hàng','quán','phòng','tắm','ngủ','y','tế','bệnh','viện',
    'thuốc','cứu','hỏa','trạm','ai','ấy','hắn','cô','dì','chú','bác','ông','bà','con','cháu','bè',
    'nhau','tạm','biệt','hẹn','lại','tên','gọi','xa','gần','thế','nào','ạ','ơi','ồ','à','lúc'];
  var EN_STOP = ['the','is','are','was','were','i','you','he','she','it','we','they','to','of','in',
    'for','on','with','at','by','from','up','about','into','over','after','be','have','has','had',
    'do','does','did','this','that','these','those','and','but','or','not','no','yes','hello','want',
    'wants','go','goes','home','station','train','how','what','where','when','why','a','an','my',
    'your','his','her','our','their','me','him','us','them','will','would','can','could','should',
    'please','thank','thanks','good','morning','afternoon','evening','night','bye','ok','okay','yeah',
    'like','get','take','make','see','know','think','say','said','tell','come','came','give','need',
    'time','today','tomorrow','yesterday','now','then','here','there','very','really','so','too',
    'just','only','also','well','right','left','straight','first','last','next','bus','taxi','hotel',
    'airport','street','road','city','country','food','water','coffee','tea','beer','wine','menu',
    'bill','check','money','ticket','passport','bag','luggage','help','emergency','doctor','pharmacy',
    'hospital','police','excuse','sorry','welcome','much','many','few','little','more','less','again',
    'still','already','yet','ever','never','always','often','sometimes','maybe','perhaps','sure',
    'course','fine','great','nice','expensive','cheap','big','small','hot','cold','open','closed',
    'early','late','far','near','fast','slow','stop','wait','walk','drive','fly','run','sit','stand',
    'eat','drink','sleep','work','play','read','write','listen','watch','learn','buy','sell','pay',
    'cost','find','love','enjoy','remember','forget','understand','believe','hope','must','all','each',
    'every','both','other','some','such','nor','own','same','than','because','as','until','while',
    'against','between','through','during','before','above','below','down','out','off','under',
    'further','once','which','who','whom','whose','hi','hey','oh','wow','uh','um','hmm','how','are',
    'you','about','back','alarm','going','america'];

  // ---------- Helpers ----------
  function normalizeText(t) { return (t || '').trim().replace(/\s+/g, ' '); }
  function stripPunct(w) { return w.replace(/[.,!?;:()"'\[\]{}<>]/g, ''); }
  function hasDiacritics(t) { return VI_DIACRITIC_RE.test(t || ''); }
  function countInList(text, list) {
    var words = normalizeText(text).toLowerCase().split(' '), n = 0;
    for (var i = 0; i < words.length; i++) if (list.indexOf(stripPunct(words[i])) >= 0) n++;
    return n;
  }

  function classifyWord(w) {
    var low = stripPunct((w || '').toLowerCase());
    if (!low) return null;
    if (VI_DIACRITIC_RE.test(w)) return 'vi';
    if (VI_STOP.indexOf(low) >= 0) return 'vi';
    if (EN_STOP.indexOf(low) >= 0) return 'en';
    if (NON_ASCII_RE.test(w)) return 'vi';
    return 'en';
  }

  // Split a text increment into maximal same-language runs (for within-chunk code-switch).
  function splitByLanguage(text) {
    var words = normalizeText(text).split(' ').filter(Boolean);
    var segs = [], curLang = null, curWords = [];
    for (var i = 0; i < words.length; i++) {
      var lang = classifyWord(words[i]) || curLang || 'en';
      if (curLang === null) { curLang = lang; curWords = [words[i]]; }
      else if (lang === curLang) { curWords.push(words[i]); }
      else {
        segs.push({ lang: curLang, text: curWords.join(' ') });
        curLang = lang; curWords = [words[i]];
      }
    }
    if (curLang !== null) segs.push({ lang: curLang, text: curWords.join(' ') });
    return segs;
  }

  // Exact-prefix guard (restart re-transcribe / cumulative result).
  function stripCommittedPrefix(seg) {
    var a = committedTail.toLowerCase().split(' ').slice(-TAIL_WORDS);
    var bLow = normalizeText(seg).toLowerCase().split(' ');
    var bOrig = normalizeText(seg).split(' ');
    var maxK = Math.min(a.length, bLow.length), k = 0, i, j, match;
    for (i = maxK; i >= 1; i--) {
      match = true;
      for (j = 0; j < i; j++) {
        if (a[a.length - i + j] !== bLow[j]) { match = false; break; }
      }
      if (match) { k = i; break; }
    }
    return bOrig.slice(k).join(' ').trim();
  }
  function appendCommitted(seg) {
    committedTail = normalizeText(committedTail + ' ' + seg)
      .split(' ').slice(-TAIL_WORDS).join(' ');
  }

  // ---------- Dual-ASR winner scoring ----------
  // Higher = better. Combines ASR confidence + language-plausibility of the transcript.
  function candidateScore(c, lang) {
    if (!c || !c.text) return -999;
    var words = c.text.split(/\s+/).filter(Boolean).length || 1;
    var s = (c.conf || 0) * 2.0;                       // ASR confidence is strongest signal
    var sw = (lang === 'vi') ? countInList(c.text, VI_STOP) : countInList(c.text, EN_STOP);
    s += (sw / words) * 0.9;                            // stopword density in matching language
    if (lang === 'vi' && hasDiacritics(c.text)) s += 0.6;    // VI recognizer + diacritics = near-certain VI
    if (lang === 'en' && hasDiacritics(c.text)) s -= 0.3;    // EN recognizer: diacritics = garble
    if (lang === 'en' && !hasDiacritics(c.text)) s += 0.05;  // EN recognizer: clean ASCII = plausible
    s += Math.min(words, 12) * 0.01;                    // slightly prefer longer (heard more)
    return s;
  }
  // Pick winner between two pending finals. Returns {lang, text} or null.
  function pickWinner(en, vi) {
    var sEn = candidateScore(en, 'en'), sVi = candidateScore(vi, 'vi');
    if (sEn < -900 && sVi < -900) return null;
    if (sVi >= sEn) return { lang: 'vi', text: vi.text };
    return { lang: 'en', text: en.text };
  }

  // ---------- Live text ----------
  function updateLiveText(text) {
    liveEl.classList.remove('status');
    liveEl.style.opacity = '';
    liveEl.textContent = text || '';
  }
  function clearLive() {
    liveEl.classList.remove('status');
    liveEl.style.opacity = '';
    liveEl.textContent = '';
  }
  function showStatus(msg) {
    liveEl.classList.add('status');
    liveEl.style.opacity = '';
    liveEl.textContent = msg;
  }

  // ---------- Row model (synchronized EN | VI) ----------
  // Each cell = {final (source, gray), trans (translation, white, below)}
  function ensureActiveRow() {
    if (!activeRow || activeRow.finalized) {
      activeRow = { en: { final: '', trans: '' }, vi: { final: '', trans: '' }, finalized: false };
      rows.push(activeRow);
    }
  }
  function appendToCell(cell, text) {
    var c = activeRow[cell];
    c.final = c.final ? c.final + ' ' + text : text;
  }
  // Winner text already known-language; still split per-word for within-chunk code-switch.
  // If only ONE channel is enabled, route ALL text to that channel (single-language mode).
  function handleIncrement(text) {
    text = normalizeText(text);
    if (!text) return;
    ensureActiveRow();
    if (channel.en && channel.vi) {
      var segs = splitByLanguage(text);
      for (var i = 0; i < segs.length; i++) {
        var s = segs[i];
        appendToCell(s.lang === 'vi' ? 'vi' : 'en', s.text);
      }
    } else {
      var cell = channel.en ? 'en' : 'vi';
      appendToCell(cell, text);
    }
    renderRows();
    scheduleTranslateActive(); // low-latency: start translating now, don't wait for chunk close
  }
  function renderCell(colEl, cell) {
    var wrap = document.createElement('div');
    wrap.className = 'row-cell';
    var pf = document.createElement('p');
    pf.className = 'final-text';
    pf.textContent = cell.final || '\u00A0'; // final = source, gray
    if (!cell.final) pf.style.opacity = '0.2';
    wrap.appendChild(pf);
    if (cell.trans) {
      var pt = document.createElement('p');
      pt.className = 'trans-text'; // translation = target, white
      pt.textContent = cell.trans;
      wrap.appendChild(pt);
    }
    colEl.appendChild(wrap);
  }
  function renderRows() {
    enEl.innerHTML = '';
    viEl.innerHTML = '';
    var le = document.createElement('div');
    le.className = 'col-label'; le.textContent = 'Final English';
    enEl.appendChild(le);
    var lv = document.createElement('div');
    lv.className = 'col-label'; lv.textContent = 'Final Vietnamese';
    viEl.appendChild(lv);
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      renderCell(enEl, r.en);
      renderCell(viEl, r.vi);
    }
    enEl.scrollTop = enEl.scrollHeight;
    viEl.scrollTop = viEl.scrollHeight;
  }

  // ---------- Translation (Phase 2) + TTS (Phase 3) ----------
  // Primary: Google Translate gtx endpoint (fast, no key, no daily limit).
  // Fallback: MyMemory (CORS-friendly). Both fail → silent, final text still shows.
  function translate(text, from, to, cb) {
    if (!text) { cb(''); return; }
    var gtx = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=' +
      from + '&tl=' + to + '&dt=t&q=' + encodeURIComponent(text);
    fetch(gtx)
      .then(function (res) { return res.json(); })
      .then(function (j) {
        var t = '';
        if (j && j[0]) j[0].forEach(function (s) { if (s && s[0]) t += s[0]; });
        if (t) cb(t); else cb('');
      })
      .catch(function () {
        var mm = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) +
          '&langpair=' + from + '|' + to;
        fetch(mm)
          .then(function (res) { return res.json(); })
          .then(function (j) { cb((j && j.responseData && j.responseData.translatedText) || ''); })
          .catch(function () { cb(''); });
      });
  }
  // Translate one cell; skip if source text unchanged since last call. On result: update + speak.
  function translateCell(cell, from, to) {
    if (!cell || !cell.final || cell._last === cell.final) return;
    cell._last = cell.final;
    translate(cell.final, from, to, function (t) {
      if (!t) return;
      cell.trans = t;
      renderRows();
      speak(t, to === 'vi' ? 'vi-VN' : 'en-US'); // TTS immediately, in the translation's language
    });
  }
  function translateRow(row) {
    if (!row) return;
    translateCell(row.en, 'en', 'vi');
    translateCell(row.vi, 'vi', 'en');
  }
  // Low-latency: translate the ACTIVE row incrementally (debounced) — don't wait for chunk close.
  var transDebounce = null;
  function scheduleTranslateActive() {
    clearTimeout(transDebounce);
    transDebounce = setTimeout(function () { translateRow(activeRow); }, 400);
  }

  // ---------- TTS (Phase 3) — speak translation immediately, offline via system voices ----------
  var voices = [];
  function loadVoices() { if (window.speechSynthesis) voices = speechSynthesis.getVoices(); }
  function pickVoice(lang) {
    var pref = lang.slice(0, 2);
    for (var i = 0; i < voices.length; i++) {
      if (voices[i].lang && voices[i].lang.slice(0, 2) === pref) return voices[i];
    }
    return null;
  }
  function speak(text, lang) {
    if (!text || !window.speechSynthesis) return;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    var v = pickVoice(lang);
    if (v) u.voice = v;
    u.rate = 1.0;
    u.pitch = 1.0;
    speechSynthesis.speak(u);
  }

  // ---------- Chunk timer: one "voice" row every CHUNK_MS ----------
  function startChunkTimer() {
    stopChunkTimer();
    chunkTimer = setInterval(function () {
      if (activeRow && (activeRow.en.final || activeRow.vi.final)) {
        activeRow.finalized = true;
        clearTimeout(transDebounce);
        translateRow(activeRow); // final translation pass for this voice chunk
        renderRows();
      }
      flushPending(); // force commit any pending winner at chunk boundary
    }, CHUNK_MS);
  }
  function stopChunkTimer() {
    if (chunkTimer) { clearInterval(chunkTimer); chunkTimer = null; }
  }

  // ---------- Dual-ASR commit ----------
  function scheduleCommit() {
    clearTimeout(commitTimer);
    commitTimer = setTimeout(flushPending, DUAL_WAIT_MS);
  }
  function flushPending() {
    clearTimeout(commitTimer);
    var en = pending.en, vi = pending.vi;
    pending = { en: null, vi: null };
    var winner = pickWinner(en, vi);
    if (!winner) return;
    var seg = stripCommittedPrefix(winner.text);
    if (seg) {
      appendCommitted(seg);
      handleIncrement(seg);
    }
  }

  // ---------- Speech result handler (per recognizer) ----------
  function onDualResult(lang, e) {
    var interim = '', finalText = '', confSum = 0, confN = 0;
    for (var i = e.resultIndex; i < e.results.length; i++) {
      var r = e.results[i];
      var alt = r[0] || {};
      var t = alt.transcript || '';
      if (r.isFinal) {
        finalText += t + ' ';
        if (typeof alt.confidence === 'number') { confSum += alt.confidence; confN++; }
      } else {
        interim += t;
      }
    }
    if (interim) updateLiveText(interim.trim());
    else clearLive();
    if (finalText.trim()) {
      // Fast-path lock: if we already committed this utterance via high-confidence,
      // discard the loser recognizer's late final so it can't inject garble.
      if (lockUntil && Date.now() < lockUntil) return;
      pending[lang] = {
        text: normalizeText(finalText),
        conf: confN ? confSum / confN : 0,
        ts: Date.now()
      };
      // Speed: commit IMMEDIATELY when both recognizers have produced a final (no wait).
      if (pending.en && pending.vi) { flushPending(); return; }
      // Speed: high-confidence final is near-certain — commit now, lock out late loser.
      if (pending[lang].conf >= FAST_CONF) { lockUntil = Date.now() + LOCK_MS; flushPending(); return; }
      // Single-channel mode: only one recognizer runs — commit immediately, no dual wait.
      if (!channel.en || !channel.vi) { flushPending(); return; }
      scheduleCommit();
    }
  }

  // ---------- Speech Recognition (dual, coordinated restart) ----------
  function makeRecognizer(lang, onResult, onEnd, onError) {
    var r = new SR();
    r.continuous = true;
    r.interimResults = true;
    r.lang = lang;
    r.maxAlternatives = 1;
    r.onresult = onResult;
    r.onend = onEnd;
    r.onerror = onError;
    try { r.start(); } catch (e) {}
    return r;
  }
  // Coordinate restarts: when either recognizer ends, wait a short window and restart
  // BOTH ended ones in the SAME synchronous tick → one mic toggle ("tíc") instead of two.
  function scheduleRestart() {
    clearTimeout(restartTimer);
    var delay = (Date.now() - lastStartTs < 700) ? 600 : 350; // cooldown if just started
    restartTimer = setTimeout(doRestart, delay);
  }
  function doRestart() {
    if (!micOn || userStopped) return;
    if (needRestart.en) { needRestart.en = false; startEN(); }
    if (needRestart.vi) { needRestart.vi = false; startVI(); }
  }
  function startEN() {
    if (!supported || recEN) return; // guard: don't double-start
    lastStartTs = Date.now();
    try {
      recEN = makeRecognizer('en-US',
        function (e) { onDualResult('en', e); },
        function () { recEN = null; needRestart.en = true; scheduleRestart(); },
        function (e) { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { userStopped = true; stopMicrophone(); showStatus('Microphone access denied.'); } });
    } catch (e) { recEN = null; }
  }
  function startVI() {
    if (!supported || viFailed || recVI) return;
    lastStartTs = Date.now();
    try {
      recVI = makeRecognizer('vi-VN',
        function (e) { onDualResult('vi', e); },
        function () { recVI = null; needRestart.vi = true; scheduleRestart(); },
        function (e) { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { viFailed = true; } });
    } catch (e) { viFailed = true; recVI = null; }
  }
  function stopRecognitionSilent() {
    clearTimeout(restartTimer); clearTimeout(commitTimer);
    needRestart.en = false; needRestart.vi = false;
    if (recEN) { try { recEN.stop(); } catch (e) {} recEN = null; }
    if (recVI) { try { recVI.stop(); } catch (e) {} recVI = null; }
  }

  // ---------- Microphone control ----------
  function startMicrophone() {
    micOn = true;
    userStopped = false;
    viFailed = false;
    committedTail = '';
    pending = { en: null, vi: null };
    needRestart = { en: false, vi: false };
    lockUntil = 0;
    lastStartTs = 0;
    rows = [];
    activeRow = null;
    renderRows();
    updateMicUI();
    startChunkTimer();
    if (channel.en) startEN();
    if (channel.vi) startVI();
  }
  function stopMicrophone() {
    userStopped = true;
    micOn = false;
    stopChunkTimer();
    clearTimeout(transDebounce);
    if (activeRow && (activeRow.en.final || activeRow.vi.final)) {
      activeRow.finalized = true;
      translateRow(activeRow);
    }
    stopRecognitionSilent();
    flushPending();
    updateMicUI();
    clearLive();
    renderRows();
  }
  function updateMicUI() {
    micBtn.classList.toggle('on', micOn);
    micBtn.setAttribute('aria-pressed', micOn ? 'true' : 'false');
  }
  micBtn.addEventListener('click', function () {
    if (micOn) stopMicrophone();
    else startMicrophone();
  });

  // ---------- Channel toggles (EN / VI) — foundation for translation / TTS Phase 2 ----------
  function updateChannelUI() {
    chEnBtn.classList.toggle('on', channel.en);
    chEnBtn.setAttribute('aria-pressed', channel.en ? 'true' : 'false');
    chViBtn.classList.toggle('on', channel.vi);
    chViBtn.setAttribute('aria-pressed', channel.vi ? 'true' : 'false');
    enEl.classList.toggle('hidden', !channel.en);
    viEl.classList.toggle('hidden', !channel.vi);
  }
  function toggleChannel(lang) {
    var next = !channel[lang];
    // at least one channel must stay on
    if (!next && (lang === 'en' ? !channel.vi : !channel.en)) return;
    channel[lang] = next;
    updateChannelUI();
    if (micOn) {
      if (!next) { // turning OFF: stop that recognizer (fewer mic toggles, less "tíc")
        needRestart[lang] = false;
        if (lang === 'en' && recEN) { try { recEN.stop(); } catch (e) {} recEN = null; }
        if (lang === 'vi' && recVI) { try { recVI.stop(); } catch (e) {} recVI = null; }
      } else { // turning ON: start it
        if (lang === 'en') startEN(); else startVI();
      }
    }
  }
  chEnBtn.addEventListener('click', function () { toggleChannel('en'); });
  chViBtn.addEventListener('click', function () { toggleChannel('vi'); });

  // ---------- Init ----------
  updateChannelUI();
  loadVoices();
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }
  liveEl.textContent = 'WebDich ' + VERSION + ' · tap mic';
  liveEl.style.opacity = '0.45';
  var badge = document.getElementById('version-badge');
  if (badge) badge.textContent = VERSION;
  if (!supported) {
    showStatus('WebDich ' + VERSION + ' · speech recognition not supported here. Use Chrome / Edge (desktop or Android) over HTTPS or localhost.');
  }

  // ---------- Test hook (Node only) ----------
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = {
      VERSION: VERSION,
      reset: function () { committedTail = ''; rows = []; activeRow = null; pending = { en: null, vi: null }; lockUntil = 0; },
      getRows: function () { return rows.map(function (r) { return { en: r.en.final, vi: r.vi.final }; }); },
      onDualResult: onDualResult,
      flushPending: flushPending,
      pickWinner: pickWinner,
      candidateScore: candidateScore,
      splitByLanguage: splitByLanguage,
      stripCommittedPrefix: stripCommittedPrefix,
      appendCommitted: appendCommitted
    };
  }
})();

</script>
</body>
</html>
