<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>WebDich v0.2 — Voice → Text</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- 1/6 — LIVE VOICE (spec §2.1): only realtime partial text -->
    <div id="live" class="live" aria-live="polite"></div>
    <!-- 4/6 — FINAL: EN left, VI right (spec §3) -->
    <div class="final">
      <div id="final-en" class="col">
        <div class="col-label">Final English</div>
      </div>
      <div id="final-vi" class="col">
        <div class="col-label">Final Vietnamese</div>
      </div>
    </div>
    <!-- 1/6 — MIC (spec §13) -->
    <div class="mic-row">
      <button id="mic" aria-label="Toggle microphone" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect class="mic-stroke" x="9" y="3" width="6" height="11" rx="3"/>
          <path class="mic-stroke" d="M5 11a7 7 0 0 0 14 0"/>
          <line class="mic-stroke" x1="12" y1="18" x2="12" y2="22"/>
        </svg>
      </button>
    </div>
  </div>
  <script src="app.js?v=0.2"></script>
</body>
</html>
